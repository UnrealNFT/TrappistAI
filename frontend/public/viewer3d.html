<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrappistAI 3D Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #fff;
        }
        #info p {
            margin: 5px 0;
            opacity: 0.9;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            text-align: center;
            z-index: 5;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            display: none;
            text-align: center;
            max-width: 500px;
        }
        #actions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover {
            background: rgba(0,0,0,0.9);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        .action-btn.save { border-color: rgba(59, 130, 246, 0.5); }
        .action-btn.share { border-color: rgba(34, 197, 94, 0.5); }
        .action-btn.save:hover { border-color: rgba(59, 130, 246, 1); }
        .action-btn.share:hover { border-color: rgba(34, 197, 94, 1); }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h1>🎨 TrappistAI 3D Viewer</h1>
        <p>🖱️ Left click: Rotate</p>
        <p>🖱️ Right click: Pan</p>
        <p>⚙️ Scroll: Zoom</p>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading 3D model...</p>
    </div>

    <div id="error">
        <h2>❌ Loading Error</h2>
        <p id="error-message"></p>
    </div>

    <div id="actions">
        <button class="action-btn download">
            <span>⬇️</span>
            <span>Download</span>
        </button>
        <button class="action-btn save">
            <span>💾</span>
            <span>Save to Gallery</span>
        </button>
        <button class="action-btn share">
            <span>📤</span>
            <span>Save & Share</span>
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('container');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const errorMsg = document.getElementById('error-message');

        // Get URL from query parameter
        const params = new URLSearchParams(window.location.search);
        const modelUrl = params.get('url');

        if (!modelUrl) {
            showError('No model URL provided. Add ?url=... to the URL');
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(3, 3, 5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x5555ff, 0.3);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);

        // Ground
        const groundGeometry = new THREE.CircleGeometry(10, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a3e,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x444466, 0x333344);
        scene.add(gridHelper);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 20;
        controls.target.set(0, 1, 0);

        // Load model
        const loader = new GLTFLoader();
        
        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;
                
                // Center and scale model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                
                model.scale.multiplyScalar(scale);
                model.position.sub(center.multiplyScalar(scale));
                model.position.y = size.y * scale / 2;
                
                // Enable shadows
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(model);
                loading.style.display = 'none';
                
                // Show action buttons
                const actionsDiv = document.getElementById('actions');
                actionsDiv.style.display = 'flex';
                
                // Auto-rotate
                model.rotation.y = Math.PI / 4;
                
                // Button handlers
                const downloadBtn = actionsDiv.querySelector('.download');
                const saveBtn = actionsDiv.querySelector('.save');
                const shareBtn = actionsDiv.querySelector('.share');
                
                downloadBtn.onclick = () => {
                    window.open(modelUrl, '_blank');
                };
                
                saveBtn.onclick = async () => {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<span>⏳</span><span>Saving...</span>';
                    try {
                        // Redirect to generate page with action
                        window.parent.postMessage({
                            action: 'save_3d',
                            url: modelUrl
                        }, '*');
                        
                        setTimeout(() => {
                            saveBtn.innerHTML = '<span>✅</span><span>Saved!</span>';
                            setTimeout(() => {
                                saveBtn.innerHTML = '<span>💾</span><span>Save to Gallery</span>';
                                saveBtn.disabled = false;
                            }, 2000);
                        }, 1000);
                    } catch (err) {
                        saveBtn.innerHTML = '<span>❌</span><span>Error</span>';
                        saveBtn.disabled = false;
                    }
                };
                
                shareBtn.onclick = async () => {
                    shareBtn.disabled = true;
                    shareBtn.innerHTML = '<span>⏳</span><span>Sharing...</span>';
                    try {
                        // Redirect to generate page with action
                        window.parent.postMessage({
                            action: 'share_3d',
                            url: modelUrl
                        }, '*');
                        
                        setTimeout(() => {
                            shareBtn.innerHTML = '<span>✅</span><span>Shared!</span>';
                            setTimeout(() => {
                                shareBtn.innerHTML = '<span>📤</span><span>Save & Share</span>';
                                shareBtn.disabled = false;
                            }, 2000);
                        }, 1000);
                    } catch (err) {
                        shareBtn.innerHTML = '<span>❌</span><span>Error</span>';
                        shareBtn.disabled = false;
                    }
                };
            },
            (progress) => {
                const percent = (progress.loaded / progress.total * 100).toFixed(0);
                loading.querySelector('p').textContent = `Loading: ${percent}%`;
            },
            (error) => {
                console.error('Loading error:', error);
                showError(`Failed to load model: ${error.message}`);
            }
        );

        function showError(message) {
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
            errorMsg.textContent = message;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
