[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy API calls to the Render backend so the same domain serves frontend + API.
[[redirects]]
  from = "/api/*"
  to = "https://trappistai-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Serve prerendered static pages for SEO-critical routes.
[[redirects]]
  from = "/generate"
  to = "/generate.html"
  status = 200

[[redirects]]
  from = "/buy-credits"
  to = "/buy-credits.html"
  status = 200

[[redirects]]
  from = "/x402"
  to = "/x402.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

# SPA fallback for all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
