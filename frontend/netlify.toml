[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy API calls to the Render backend so the same domain serves frontend + API.
[[redirects]]
  from = "/api/*"
  to = "https://trappistai-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
