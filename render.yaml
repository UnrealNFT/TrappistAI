services:
  # FastAPI Backend
  - type: web
    name: trappistai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: |
      echo "nameserver 8.8.8.8" > /etc/resolv.conf
      echo "nameserver 1.1.1.1" >> /etc/resolv.conf
      echo "options ndots:0" >> /etc/resolv.conf
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /

  # Telegram Bot Worker + Crypto News Fetcher (same process)
  - type: worker
    name: trappistai-bot
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
